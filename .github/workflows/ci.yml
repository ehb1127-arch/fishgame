name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  test:
    name: Rules engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Import project
        run: |
          # The first run generates .godot/ and reports any script that fails
          # to parse. It exits non-zero on a hard error, which is what we want.
          ~/godot-bin/godot --headless --path . --import

      - name: Run engine tests
        run: |
          set -euo pipefail
          ~/godot-bin/godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee /tmp/test-output.txt
          # The runner prints this line only when every assertion passed.
          grep -q "ALL TESTS PASSED" /tmp/test-output.txt

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test-output.txt
          if-no-files-found: ignore
