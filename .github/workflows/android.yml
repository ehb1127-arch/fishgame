name: Android build

on:
  push:
    tags: ["v*"]
    # Pushing a build/* branch produces an APK without cutting a release,
    # which is also the way to get one when tag pushes are unavailable.
    branches: ["build/**"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which build to produce"
        required: true
        default: debug
        type: choice
        options: [debug, release]

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: AbyssTCG

jobs:
  build:
    name: Export APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Generate debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the Android SDK
        run: |
          # Godot reads the SDK and debug keystore paths from editor settings,
          # which do not exist on a fresh runner, so write them ourselves.
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: ~/godot-bin/godot --headless --path . --import

      - name: Export APK
        run: |
          set -euo pipefail
          mkdir -p builds
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            # A release export needs a signing key in repository secrets; without
            # one Godot would produce an unsigned APK, so fail loudly instead.
            if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
              echo "release build requires the ANDROID_KEYSTORE_BASE64 secret" >&2
              exit 1
            fi
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/release.keystore
            ~/godot-bin/godot --headless --path . \
              --export-release "Android" "builds/${EXPORT_NAME}.apk"
          else
            ~/godot-bin/godot --headless --path . \
              --export-debug "Android" "builds/${EXPORT_NAME}-debug.apk"
          fi
          ls -lh builds/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: builds/*.apk
          if-no-files-found: error
